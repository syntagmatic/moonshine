<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>diagram-math.js — Sanity Checks</title>
<script src="../docs/mathematical-diagrams/lib/diagram-math.js"></script>
<script src="../docs/lib/motion.js"></script>
<style>
body { font-family: 'Source Code Pro', monospace; font-size: 14px; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #fafafa; color: #1a1a2e; }
h1 { font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 1.5rem; margin-bottom: 1rem; }
h2 { font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 1.1rem; margin: 2rem 0 0.5rem; color: #4a4a6a; }
.test { padding: 0.3rem 0; border-bottom: 1px solid #e2e2e8; }
.pass { color: #059669; }
.fail { color: #dc2626; font-weight: bold; }
.summary { margin-top: 2rem; padding: 1rem; border-radius: 6px; font-weight: 600; }
.summary.all-pass { background: #d1fae5; color: #065f46; }
.summary.has-fail { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<h1>diagram-math.js, Sanity Checks</h1>
<div id="results"></div>
<div id="summary"></div>

<script>
var results = document.getElementById('results');
var passed = 0, failed = 0;

function assert(name, condition, detail) {
  var div = document.createElement('div');
  div.className = 'test';
  if (condition) {
    div.innerHTML = '<span class="pass">PASS</span> ' + name;
    passed++;
  } else {
    div.innerHTML = '<span class="fail">FAIL</span> ' + name + (detail ? ' — ' + detail : '');
    failed++;
  }
  results.appendChild(div);
}

function section(title) {
  var h = document.createElement('h2');
  h.textContent = title;
  results.appendChild(h);
}

// ─── Braid ───
section('Braid');

assert('format [1,-2,1] = σ₁ σ₂⁻¹ σ₁',
  Diag.braid.format([1, -2, 1]) === 'σ₁ σ₂⁻¹ σ₁');

assert('cancel [1,-1] = []', Diag.braid.cancel([1, -1]).length === 0);
assert('cancel [1,2,-2,-1] = []', Diag.braid.cancel([1, 2, -2, -1]).length === 0);

var perm = Diag.braid.permutation([1], 3);
assert('σ_1 on 3 strands: swap 0,1', perm[0] === 1 && perm[1] === 0 && perm[2] === 2);

var paths = Diag.braid.strandPaths([1, 2], 3);
assert('strandPaths returns n+1 position arrays', paths.length === 3);

// ─── Knot ───
section('Knot');

var tref = Diag.knot.presets.trefoil();
assert('Trefoil has crossing number 3', tref.crossingNumber === 3);

var figEight = Diag.knot.presets.figureEight();
assert('Figure-eight has crossing number 4', figEight.crossingNumber === 4);

assert('Writhe of trefoil crossings = 3',
  Diag.knot.writhe(tref.crossings.map(function (c) { return { sign: c.sign }; })) === 3);

// ─── Commutative Diagrams ───
section('Commutative Diagrams');

var sq = Diag.commDiag.presets.square();
assert('Square preset has 4 nodes', sq.nodes.length === 4);
assert('Square preset has 4 arrows', sq.arrows.length === 4);

var snake = Diag.commDiag.presets.snakeLemma();
assert('Snake lemma has 10 nodes', snake.nodes.length === 10);

var exact = Diag.commDiag.presets.exactSequence();
assert('Exact sequence has 5 nodes', exact.nodes.length === 5);

// ─── Formatting ───
section('Formatting');

assert('fmt.group(196884) = "196,884"', Diag.fmt.group(196884) === '196,884');
assert('fmt.sub(3) = ₃', Diag.fmt.sub(3) === '₃');
assert('fmt.sup(2) = ²', Diag.fmt.sup(2) === '²');

// ─── Summary ───
var summaryDiv = document.getElementById('summary');
summaryDiv.className = 'summary ' + (failed === 0 ? 'all-pass' : 'has-fail');
summaryDiv.textContent = passed + ' passed, ' + failed + ' failed, ' + (passed + failed) + ' total';
</script>
</body>
</html>
