<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>sheaf-math.js: sanity checks</title>
<script src="../docs/sheaves/lib/sheaf-math.js"></script>
<script src="../docs/sheaves/lib/nsd.js"></script>
<style>
  body { font-family: 'Source Code Pro', monospace; padding: 1.5rem; background: #0f172a; color: #e2e8f0; }
  h1 { font-family: system-ui; }
  pre { background: #1e293b; padding: 1rem; border-radius: 6px; line-height: 1.5; }
  .pass { color: #34d399; }
  .fail { color: #f87171; }
</style>
</head>
<body>
<h1>sheaf-math.js and nsd.js sanity checks</h1>
<p>Also runnable in node: <code>node -e "require('./docs/sheaves/lib/sheaf-math.js').runChecks()"</code> and the same for <code>nsd.js</code>.</p>
<pre id="log"></pre>
<script>
var log = document.getElementById('log'), results = Sheaf.runChecks().concat(NSD.runChecks().map(function (r) { return { name: 'nsd: ' + r.name, ok: r.ok, detail: r.detail }; }));
results.forEach(function (r) {
  var line = document.createElement('span');
  line.className = r.ok ? 'pass' : 'fail';
  line.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.detail ? '  (' + r.detail + ')' : '') + '\n';
  log.appendChild(line);
});
var failed = results.filter(function (r) { return !r.ok; }).length;
document.title = (failed ? failed + ' failed' : 'all ' + results.length + ' passed') + ' · sheaf-math.js, nsd.js';
log.appendChild(document.createTextNode('\n' + (results.length - failed) + ' / ' + results.length + ' passed\n'));
</script>
</body>
</html>
