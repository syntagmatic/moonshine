<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>06-tsunami-source.js: sanity checks</title>
<script src="../docs/japan-earthquakes/shared/06-tsunami-source.js"></script>
<style>
  body { font-family: 'Source Code Pro', monospace; padding: 1.5rem; background: #0f172a; color: #e2e8f0; }
  h1 { font-family: system-ui; }
  pre { background: #1e293b; padding: 1rem; border-radius: 6px; line-height: 1.5; }
  .pass { color: #34d399; }
  .fail { color: #f87171; }
</style>
</head>
<body>
<h1>japan-earthquakes 06-tsunami-source.js sanity checks</h1>
<p>Also runnable in node: <code>node -e "require('./docs/japan-earthquakes/shared/06-tsunami-source.js').runChecks()"</code></p>
<pre id="log"></pre>
<script>
var log = document.getElementById('log'), results = TsunamiSource.runChecks(false);
results.forEach(function (r) {
  var line = document.createElement('span');
  line.className = r.ok ? 'pass' : 'fail';
  line.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.detail ? '  (' + r.detail + ')' : '') + '\n';
  log.appendChild(line);
});
var failed = results.filter(function (r) { return !r.ok; }).length;
document.title = (failed ? failed + ' failed' : 'all ' + results.length + ' passed') + ' · 06-tsunami-source.js';
log.appendChild(document.createTextNode('\n' + (results.length - failed) + ' / ' + results.length + ' passed\n'));
</script>
</body>
</html>
