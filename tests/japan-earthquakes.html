<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>japan-earthquakes: library checks</title>
<script src="japan-earthquakes.libs.js"></script>
<style>
  body { font-family: 'Source Code Pro', monospace; padding: 1.5rem; background: #0f172a; color: #e2e8f0; }
  h1 { font-family: system-ui; }
  h2 { font-family: system-ui; font-size: 1rem; margin: 1.2rem 0 0.3rem; }
  pre { background: #1e293b; padding: 1rem; border-radius: 6px; line-height: 1.5; margin: 0; }
  .pass { color: #34d399; }
  .fail { color: #f87171; }
  .skip { color: #94a3b8; }
</style>
</head>
<body>
<h1>japan-earthquakes library checks</h1>
<p>Also runnable in node: <code>node scripts/japan-test.mjs</code></p>
<div id="out"></div>
<pre id="total"></pre>
<script>
(async function () {
  var base = '../docs/japan-earthquakes/shared/', out = document.getElementById('out');
  var total = 0, failed = 0;
  function load(src) {
    return new Promise(function (res) {
      var s = document.createElement('script');
      s.src = src; s.onload = function () { res(true); }; s.onerror = function () { res(false); };
      document.head.appendChild(s);
    });
  }
  for (var i = 0; i < JAPAN_TEST_LIBS.length; i++) {
    var lib = JAPAN_TEST_LIBS[i];
    var h = document.createElement('h2'); h.textContent = lib.file; out.appendChild(h);
    var pre = document.createElement('pre'); out.appendChild(pre);
    if (!(await load(base + lib.file)) || !window[lib.global]) {
      pre.innerHTML = '<span class="skip">not present, skipped</span>'; continue;
    }
    var data = undefined;
    if (lib.data) {
      try { data = await (await fetch(base + 'data/' + lib.data)).json(); }
      catch (e) { pre.innerHTML = '<span class="fail">FAIL could not load data/' + lib.data + '</span>'; failed++; total++; continue; }
    }
    var results;
    try { results = window[lib.global].runChecks(false, data); }
    catch (e) { results = [{ name: 'runChecks threw', ok: false, detail: String(e) }]; }
    results.forEach(function (r) {
      var line = document.createElement('span');
      line.className = r.ok ? 'pass' : 'fail';
      line.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.detail ? '  (' + r.detail + ')' : '') + '\n';
      pre.appendChild(line);
      total++; if (!r.ok) failed++;
    });
  }
  document.title = (failed ? failed + ' failed' : 'all ' + total + ' passed') + ' · japan-earthquakes';
  document.getElementById('total').textContent = (total - failed) + ' / ' + total + ' passed';
})();
</script>
</body>
</html>
