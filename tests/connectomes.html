<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>graph.js: sanity checks</title>
<script src="../docs/connectomes/shared/graph.js"></script>
<style>
  body { font-family: 'Source Code Pro', monospace; padding: 1.5rem; background: #0f172a; color: #e2e8f0; }
  h1 { font-family: system-ui; }
  pre { background: #1e293b; padding: 1rem; border-radius: 6px; line-height: 1.5; }
  .pass { color: #34d399; }
  .fail { color: #f87171; }
</style>
</head>
<body>
<h1>connectomes graph.js sanity checks</h1>
<p>Also runnable in node: <code>node -e "const G = require('./docs/connectomes/shared/graph.js'); G.runChecks(); G.dataChecks(require('./docs/connectomes/shared/data/worm-varshney.json'))"</code></p>
<pre id="log"></pre>
<script>
var log = document.getElementById('log');
function show(results) {
  results.forEach(function (r) {
    var line = document.createElement('span');
    line.className = r.pass ? 'pass' : 'fail';
    line.textContent = (r.pass ? 'PASS ' : 'FAIL ') + r.name + '\n';
    log.appendChild(line);
  });
  return results;
}
var all = show(GraphLib.runChecks(function () {}));
fetch('../docs/connectomes/shared/data/worm-varshney.json').then(function (r) { return r.json(); }).then(function (data) {
  all = all.concat(show(GraphLib.dataChecks(data, function () {})));
}).catch(function (e) {
  all.push({ name: 'load worm-varshney.json: ' + e, pass: false }); show(all.slice(-1));
}).then(function () {
  var failed = all.filter(function (r) { return !r.pass; }).length;
  document.title = (failed ? failed + ' failed' : 'all ' + all.length + ' passed') + ' · connectomes graph.js';
  log.appendChild(document.createTextNode('\n' + (all.length - failed) + ' / ' + all.length + ' passed\n'));
});
</script>
</body>
</html>
