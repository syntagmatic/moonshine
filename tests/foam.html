<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>foam libraries: sanity checks</title>
<script src="../docs/foam/lib/cells.js"></script>
<script src="../docs/foam/lib/evolver.js"></script>
<style>
  body { font-family: 'Source Code Pro', monospace; padding: 1.5rem; background: #0f172a; color: #e2e8f0; }
  h1 { font-family: system-ui; }
  pre { background: #1e293b; padding: 1rem; border-radius: 6px; line-height: 1.5; }
  .pass { color: #34d399; }
  .fail { color: #f87171; }
</style>
</head>
<body>
<h1>cells.js and evolver.js sanity checks</h1>
<p>Also runnable in node, with every other library in <code>docs/foam/lib/</code> that has a <code>runChecks()</code>: <code>node scripts/foam-test.mjs</code>. Add <code>--convergence</code> for the mesh-refinement study behind the relaxed wall costs.</p>
<pre id="log"></pre>
<script>
var tag = function (lib, list) { return list.map(function (r) { return { name: lib + ': ' + r.name, ok: r.ok, detail: r.detail }; }); };
var log = document.getElementById('log'), results = tag('cells', FoamCells.runChecks()).concat(tag('evolver', FoamEvolver.runChecks(FoamCells)));
results.forEach(function (r) {
  var line = document.createElement('span');
  line.className = r.ok ? 'pass' : 'fail';
  line.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.detail ? '  (' + r.detail + ')' : '') + '\n';
  log.appendChild(line);
});
var failed = results.filter(function (r) { return !r.ok; }).length;
document.title = (failed ? failed + ' failed' : 'all ' + results.length + ' passed') + ' · foam libraries';
log.appendChild(document.createTextNode('\n' + (results.length - failed) + ' / ' + results.length + ' passed\n'));
</script>
</body>
</html>
