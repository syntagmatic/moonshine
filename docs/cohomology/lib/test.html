<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>coh-math.js — sanity checks</title>
<script src="../../vendor/js/d3.v7.min.js"></script>
<script src="../../topological-data-analysis/lib/tda-math.js"></script>
<script src="coh-math.js"></script>
<style>
  body { font-family: 'Source Code Pro', monospace; padding: 1.5rem; background: #0f172a; color: #e2e8f0; }
  h1 { font-family: system-ui; }
  pre { background: #1e293b; padding: 1rem; border-radius: 6px; line-height: 1.5; }
  .pass { color: #34d399; }
  .fail { color: #f87171; }
  .info { color: #93c5fd; }
</style>
</head>
<body>
<h1>coh-math.js sanity checks</h1>
<p>Open the browser console to see the full <code>runChecks()</code> output. The summary below is what this page assembles.</p>
<pre id="log"></pre>

<script>
var log = document.getElementById('log');
function out(msg, cls) {
  var line = document.createElement('span');
  if (cls) line.className = cls;
  line.textContent = msg + '\n';
  log.appendChild(line);
}

// Re-run checks and capture console output.
var passed = [];
var failed = [];
var origError = console.error;
var origLog = console.log;
console.error = function () {
  failed.push(Array.from(arguments).join(' '));
  origError.apply(console, arguments);
};
console.log = function () {
  passed.push(Array.from(arguments).join(' '));
  origLog.apply(console, arguments);
};

COH._runChecks();

console.error = origError;
console.log = origLog;

if (failed.length === 0) {
  out('All COH checks passed.', 'pass');
} else {
  failed.forEach(function (m) { out('FAIL: ' + m, 'fail'); });
}
out('');
out('Per-surface betti (Z/2):', 'info');
var surfaces = [
  ['S^2',     COH.tri.s2()],
  ['T^2',     COH.tri.torus7()],
  ['RP^2',    COH.tri.rp2()],
  ['Klein',   COH.tri.klein()],
  ['Wedge',   COH.tri.wedgeS1S1S2()],
  ['Annulus', COH.tri.annulus(8, 16)],
  ['Fig-8',   COH.tri.figureEight()]
];
surfaces.forEach(function (s) {
  var b = [
    COH.cohomology.compute(s[1], 0).betti,
    COH.cohomology.compute(s[1], 1).betti,
    COH.cohomology.compute(s[1], 2).betti
  ];
  out('  ' + s[0].padEnd(10) + ' β = (' + b.join(', ') + ')');
});

out('');
out('Cup product on RP^2:', 'info');
var rp2 = COH.tri.rp2();
var h1 = COH.cohomology.compute(rp2, 1);
var h2 = COH.cohomology.compute(rp2, 2);
var aa = COH.cup.product(rp2, h1.basis[0], h1.basis[0], 1, 1);
out('  α    = ' + COH.fmt.cochain(rp2, 1, h1.basis[0]));
out('  α∪α  = ' + COH.fmt.cochain(rp2, 2, aa));
out('  (in H^2 basis)  = ' + Array.from(COH.cup._expressInBasis(rp2, 2, aa, h2.basis)));

out('');
out('Klein-vs-torus cup product (the bona-fide distinguisher):', 'info');
['Klein bottle', 'Torus'].forEach(function (name, ti) {
  var cpx = ti === 0 ? COH.tri.klein() : COH.tri.torus7();
  var h1 = COH.cohomology.compute(cpx, 1);
  var h2 = COH.cohomology.compute(cpx, 2);
  out('  ' + name + ':');
  for (var i = 0; i < h1.basis.length; i++) {
    var aa = COH.cup.product(cpx, h1.basis[i], h1.basis[i], 1, 1);
    var c = COH.cup._expressInBasis(cpx, 2, aa, h2.basis);
    out('    α_' + i + ' ∪ α_' + i + ' coeffs in H^2: ' + Array.from(c));
  }
});
</script>
</body>
</html>
