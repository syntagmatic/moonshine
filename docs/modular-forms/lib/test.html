<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>modular-math.js — sanity checks</title>
<script src="modular-math.js"></script>
<script src="../lib/motion.js"></script>
<style>
body { font-family: monospace; font-size: 14px; padding: 2rem; }
.pass { color: green; } .fail { color: red; font-weight: bold; }
h2 { margin-top: 2rem; }
</style>
</head>
<body>
<h1>modular-math.js tests</h1>
<div id="out"></div>
<script>
var out = document.getElementById('out');
var pass = 0, fail = 0;

function check(label, cond) {
  var cls = cond ? 'pass' : 'fail';
  var sym = cond ? '✓' : '✗';
  out.innerHTML += '<div class="' + cls + '">' + sym + ' ' + label + '</div>';
  if (cond) pass++; else fail++;
}

function near(a, b, eps) { return Math.abs(a - b) < (eps || 0.5); }

// ── Eisenstein coefficients ──
out.innerHTML += '<h2>Eisenstein series</h2>';
check('E₄[0] = 1', Mod.eisenstein.E4[0] === 1);
check('E₄[1] = 240', Mod.eisenstein.E4[1] === 240);
check('E₄[2] = 2160 (240·σ₃(2)=240·9)', Mod.eisenstein.E4[2] === 2160);
check('E₄[3] = 6720 (240·28)', Mod.eisenstein.E4[3] === 6720);
check('E₆[0] = 1', Mod.eisenstein.E6[0] === 1);
check('E₆[1] = −504', Mod.eisenstein.E6[1] === -504);
check('σ₃(1) = 1', Mod.eisenstein.sigma(1, 3) === 1);
check('σ₃(2) = 9', Mod.eisenstein.sigma(2, 3) === 9);
check('σ₃(4) = 73', Mod.eisenstein.sigma(4, 3) === 73);

// ── Ramanujan τ ──
out.innerHTML += '<h2>Ramanujan τ</h2>';
check('τ(1) = 1', Mod.delta.tau(1) === 1);
check('τ(2) = −24', Mod.delta.tau(2) === -24);
check('τ(3) = 252', Mod.delta.tau(3) === 252);
check('τ(4) = −1472', Mod.delta.tau(4) === -1472);
check('τ(5) = 4830', Mod.delta.tau(5) === 4830);
check('τ(6) = −6048', Mod.delta.tau(6) === -6048);
check('τ(7) = −16744', Mod.delta.tau(7) === -16744);
check('τ(8) = 84480', Mod.delta.tau(8) === 84480);
check('τ(9) = −113643', Mod.delta.tau(9) === -113643);
check('τ(10) = −115920', Mod.delta.tau(10) === -115920);
check('τ(11) = 534612', Mod.delta.tau(11) === 534612);
check('τ(12) = −370944', Mod.delta.tau(12) === -370944);
check('τ multiplicative: τ(6) = τ(2)τ(3)', Mod.delta.tau(6) === Mod.delta.tau(2) * Mod.delta.tau(3));
check('Ramanujan cong: τ(n) ≡ σ₁₁(n) mod 691 for n=2',
  ((Mod.delta.tau(2) - Mod.eisenstein.sigma(2, 11)) % 691 + 691) % 691 === 0);

// ── j-function ──
out.innerHTML += '<h2>j-function</h2>';
check('c(−1) = 1', Mod.jfn.coeff(-1) === 1);
check('c(0) = 744', Mod.jfn.coeff(0) === 744);
check('c(1) = 196 884', Mod.jfn.coeff(1) === 196884);
check('c(2) = 21 493 760', Mod.jfn.coeff(2) === 21493760);
check('c(3) = 864 299 970', Mod.jfn.coeff(3) === 864299970);
var ji = Mod.jfn.eval({ re: 0, im: 1 });
check('j(i) ≈ 1728', near(ji.re, 1728, 1) && Math.abs(ji.im) < 1);
var jr = Mod.jfn.eval(Mod.sl2z.rho);
check('j(ρ) ≈ 0', Math.abs(jr.re) < 1 && Math.abs(jr.im) < 1);

// ── Dimension formulas ──
out.innerHTML += '<h2>Dimensions</h2>';
check('dim M₀ = 1', Mod.dim.M(0) === 1);
check('dim M₂ = 0', Mod.dim.M(2) === 0);
check('dim M₄ = 1', Mod.dim.M(4) === 1);
check('dim M₆ = 1', Mod.dim.M(6) === 1);
check('dim M₈ = 1', Mod.dim.M(8) === 1);
check('dim M₁₀ = 1', Mod.dim.M(10) === 1);
check('dim M₁₂ = 2', Mod.dim.M(12) === 2);
check('dim M₁₄ = 1', Mod.dim.M(14) === 1);
check('dim M₂₄ = 3', Mod.dim.M(24) === 3);
check('dim S₁₂ = 1', Mod.dim.S(12) === 1);
check('dim S₁₆ = 1', Mod.dim.S(16) === 1);
check('dim S₂₄ = 2', Mod.dim.S(24) === 2);
check('basis(12) has 2 monomials', Mod.dim.basis(12).length === 2);

// ── SL₂(ℤ) geometry ──
out.innerHTML += '<h2>SL₂(ℤ)</h2>';
var tau = { re: 0.3, im: 0.4 };
var st = Mod.sl2z.applyS(tau);
check('S is involution: S(S(τ)) ≈ τ',
  near(Mod.sl2z.applyS(st).re, tau.re, 1e-10) &&
  near(Mod.sl2z.applyS(st).im, tau.im, 1e-10));
var red = Mod.sl2z.reduce({ re: 2.3, im: 0.2 });
check('reduce lands in F: |Re| ≤ 0.5', Math.abs(red.point.re) <= 0.5 + 1e-8);
check('reduce lands in F: |τ| ≥ 1',
  red.point.re * red.point.re + red.point.im * red.point.im >= 1 - 1e-8);
check('hypDist(i, 2i) = ln 2', near(Mod.sl2z.hypDist(
  { re: 0, im: 1 }, { re: 0, im: 2 }), Math.log(2), 1e-10));

// ── Γ₀(N) ──
out.innerHTML += '<h2>Γ₀(N)</h2>';
check('[SL₂(ℤ):Γ₀(1)] = 1', Mod.gamma0.index(1) === 1);
check('[SL₂(ℤ):Γ₀(2)] = 3', Mod.gamma0.index(2) === 3);
check('[SL₂(ℤ):Γ₀(11)] = 12', Mod.gamma0.index(11) === 12);
check('genus Γ₀(1) = 0', Mod.gamma0.genus(1) === 0);
check('genus Γ₀(11) = 1', Mod.gamma0.genus(11) === 1);
check('genus Γ₀(23) = 2', Mod.gamma0.genus(23) === 2);
check('cusps Γ₀(6) = 4', Mod.gamma0.cusps(6) === 4);

// ── Hecke ──
out.innerHTML += '<h2>Hecke operators</h2>';
var dCoeffs = Mod.delta.coeffs.slice(0, 15);
var t2d = Mod.hecke.T(2, dCoeffs, 12);
// Δ is a Hecke eigenform with eigenvalue τ(2) = −24
// So T_2(Δ) should have coefficients τ(2) · τ(n)
check('T₂(Δ) eigenvalue: T₂Δ[1] = τ(2)·τ(1) = −24',
  near(t2d[1], -24, 1));

// ── Elliptic curves ──
out.innerHTML += '<h2>Elliptic curves</h2>';
check('Legendre (2/7) = 1 (since 3²≡2)', Mod.elliptic.legendre(2, 7) === 1);
check('Legendre (3/7) = −1', Mod.elliptic.legendre(3, 7) === -1);
check('j(y²=x³−x) = 1728', Mod.elliptic.j(-1, 0) === 1728);
check('j(y²=x³−1) = 0', Mod.elliptic.j(0, -1) === 0);
// y² = x³ − x over F₅: check #E = 4 ⟹ a₅ = 2
check('a₅(y²=x³−x) = 2', Mod.elliptic.ap(-1, 0, 5) === 2);

// ── Summary ──
out.innerHTML += '<h2>Summary</h2>';
out.innerHTML += '<div class="' + (fail === 0 ? 'pass' : 'fail') + '">' +
  pass + ' passed, ' + fail + ' failed</div>';
</script>
</body>
</html>
