<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathway Diagram — Moonshine</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --article-width: 740px;
  --body-font: 'Source Serif 4', Georgia, serif;
  --heading-font: 'Source Sans 3', system-ui, sans-serif;
  --mono-font: 'Source Code Pro', monospace;
  --body-size: 1.125rem;
  --line-height: 1.6;
  --text: #1a1a2e;
  --text-2: #4a4a6a;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --bg: #fafafa;
  --fig-bg: #ffffff;
  --border: #e2e2e8;
  --c-tp53: #ef4444;
  --c-cdkn1a: #2563eb;
}

body { font-family: var(--body-font); font-size: var(--body-size); line-height: var(--line-height); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
.article { max-width: var(--article-width); margin: 0 auto; padding: 2rem 1.25rem 6rem; }
h1, h2, h3 { font-family: var(--heading-font); font-weight: 700; line-height: 1.2; }
h1 { font-size: 2.5rem; margin: 0 0 0.5rem; }
h2 { font-size: 1.5rem; margin: 3rem 0 1rem; }
p { margin: 0 0 1rem; }
a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

.t-tp53 { color: var(--c-tp53); font-weight: 600; }
.t-cdkn1a { color: var(--c-cdkn1a); font-weight: 600; }

.figure { margin: 2rem 0; padding: 1.5rem; background: var(--fig-bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.figure-wide { margin-left: -2rem; margin-right: -2rem; }
.figure-caption { font-family: var(--heading-font); font-size: 0.85rem; color: var(--text-2); margin-top: 0.75rem; line-height: 1.4; }
.figure-label { font-weight: 600; color: var(--text); }

.insight { background: var(--accent-light); border-left: 3px solid var(--accent); padding: 1rem 1.25rem; margin: 1.5rem 0; border-radius: 0 4px 4px 0; }
.insight p { margin: 0; }

svg text { font-family: var(--heading-font); }
@media (max-width: 640px) { .figure-wide { margin-left: 0; margin-right: 0; } h1 { font-size: 1.75rem; } }
</style>
</head>
<body>

<div class="article">
  <header style="margin-bottom: 3rem;">
    <a href="index.html" style="font-family: var(--heading-font); font-size: 0.85rem; text-decoration: none; color: var(--text-2); display: inline-block; margin-bottom: 1rem;">&larr; Bioinformatics Series</a>
    <h1>Pathway Diagrams</h1>
    <p style="font-family: var(--heading-font); font-size: 1.15rem; color: var(--text-2); max-width: 600px;">
      How does the signal flow from <span class="t-tp53">TP53</span> to <span class="t-cdkn1a">CDKN1A</span>?
    </p>
  </header>

  <p>A <strong>pathway diagram</strong> maps molecular events as a network. The p53 pathway coordinates the response to DNA damage.</p>

  <div class="figure figure-wide">
    <div id="pathway-main"></div>
    <p class="figure-caption">
      <span class="figure-label">Figure 1.</span> Signal flow from <span class="t-tp53">TP53</span> to <span class="t-cdkn1a">CDKN1A</span>.
    </p>
  </div>

  <footer style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border); font-family: var(--heading-font); font-size: 0.85rem; color: var(--text-2);">
    <p>Next: <a href="15-ppi-network.html" style="color: var(--accent);">PPI Networks</a> &rarr;</p>
    <p style="margin-top: 1rem; opacity: 0.6;">Built with <a href="https://github.com/enjalot/moonshine" style="color: var(--text-2);">moonshine</a>.</p>
  </footer>
</div>

<script>
const nodes = [
  { id: 'DNA', label: 'DNA Damage' },
  { id: 'TP53', label: 'TP53', color: '#ef4444' },
  { id: 'CDKN1A', label: 'CDKN1A', color: '#2563eb' },
  { id: 'BAX', label: 'BAX' }
];
const links = [
  { s: 'DNA', t: 'TP53' }, { s: 'TP53', t: 'CDKN1A' }, { s: 'TP53', t: 'BAX' }
];

(function() {
  const container = d3.select('#pathway-main');
  function render() {
    container.selectAll('*').remove();
    const width = container.node().getBoundingClientRect().width || 700;
    const height = 350;
    const svg = container.append('svg').attr('viewBox', `0 0 ${width} ${height}`).style('width', '100%').style('height', 'auto');
    const nodePos = {
      'DNA': { x: width/2, y: 50 },
      'TP53': { x: width/2, y: 150 },
      'CDKN1A': { x: width/2-150, y: 250 },
      'BAX': { x: width/2+150, y: 250 }
    };
    const defs = svg.append('defs');
    defs.append('marker').attr('id', 'arrow').attr('viewBox', '0 0 10 10').attr('refX', 25).attr('refY', 5).attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto-start-reverse').append('path').attr('d', 'M 0 0 L 10 5 L 0 10 z').attr('fill', '#94a3b8');
    
    svg.selectAll('line').data(links).enter().append('line').attr('x1', d => nodePos[d.s].x).attr('y1', d => nodePos[d.s].y).attr('x2', d => nodePos[d.t].x).attr('y2', d => nodePos[d.t].y).attr('stroke', '#cbd5e1').attr('stroke-width', 2).attr('marker-end', 'url(#arrow)');
    
    const g = svg.selectAll('g').data(nodes).enter().append('g').attr('transform', d => `translate(${nodePos[d.id].x},${nodePos[d.id].y})`);
    g.append('circle').attr('r', 25).attr('fill', d => d.color || '#fff').attr('stroke', '#cbd5e1').attr('stroke-width', 2);
    g.append('text').text(d => d.label).attr('dy', 40).attr('text-anchor', 'middle').style('font-size', '12px').style('font-weight', '600');
  }
  render();
  new ResizeObserver(render).observe(container.node());
})();
</script>
</body>
</html>
