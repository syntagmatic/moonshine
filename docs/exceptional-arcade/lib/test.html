<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exceptional Arcade — Library Tests</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 720px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #1a1a2e;
    background: #fafafa;
    line-height: 1.5;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .subtitle { color: #4a4a6a; margin-bottom: 2rem; }
  .result { padding: 0.7rem 1rem; border-radius: 4px; margin: 0.5rem 0; }
  .pass { background: #dcfce7; color: #14532d; border-left: 4px solid #16a34a; }
  .fail { background: #fee2e2; color: #7f1d1d; border-left: 4px solid #dc2626; }
  .summary { margin-top: 2rem; padding: 1rem; border-radius: 4px; font-weight: 600; font-size: 1.15rem; }
  .summary.all-pass { background: #dcfce7; color: #14532d; }
  .summary.any-fail { background: #fee2e2; color: #7f1d1d; }
  code { font-family: 'Source Code Pro', ui-monospace, monospace; font-size: 0.9em; }
  .section { margin-top: 2rem; }
  .section h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
</style>
</head>
<body>

<h1>Exceptional Arcade — Library Tests</h1>
<p class="subtitle">Assertions for <code>arcade.js</code> primitives, <code>e8-math.js</code> parity with the main E8 series lib, and the Track B <code>oct-math.js</code> surface.</p>

<div id="results"></div>
<div id="summary" class="summary"></div>

<script src="arcade.js"></script>
<script src="e8-math.js"></script>
<script src="oct-math.js"></script>
<script>
(function () {
  var results = document.getElementById('results');
  var summary = document.getElementById('summary');
  var passed = 0;
  var failed = 0;

  function assert(name, condition, detail) {
    var row = document.createElement('div');
    row.className = 'result ' + (condition ? 'pass' : 'fail');
    row.innerHTML = (condition ? '&#10003; ' : '&#10007; ') + '<strong>' + name + '</strong>' + (detail ? ' &mdash; <code>' + detail + '</code>' : '');
    results.appendChild(row);
    if (condition) passed++; else failed++;
  }

  function section(title) {
    var h = document.createElement('h2');
    h.textContent = title;
    var wrap = document.createElement('div');
    wrap.className = 'section';
    wrap.appendChild(h);
    results.appendChild(wrap);
  }

  section('arcade.js primitives');
  assert('arcade.Timer is a function', typeof arcade.Timer === 'function');
  assert('arcade.Scoreboard is a function', typeof arcade.Scoreboard === 'function');
  assert('arcade.Streak is a function', typeof arcade.Streak === 'function');
  assert('arcade.flash is a function', typeof arcade.flash === 'function');
  assert('arcade.nearestPoint is a function', typeof arcade.nearestPoint === 'function');
  assert('arcade.makeDraggable is a function', typeof arcade.makeDraggable === 'function');

  section('nearestPoint hit testing');
  var idx = arcade.nearestPoint([[0, 0], [10, 10], [20, 20]], 11, 11, 5);
  assert('click at (11,11) with tolerance 5 finds index 1', idx === 1, 'got ' + idx);
  var idx2 = arcade.nearestPoint([[0, 0], [100, 100]], 50, 50, 5);
  assert('click halfway between points with tight tolerance returns -1', idx2 === -1, 'got ' + idx2);
  var idx3 = arcade.nearestPoint([[0, 0], [100, 100]], 50, 50, 80);
  assert('same click with loose tolerance finds index 0', idx3 === 0, 'got ' + idx3);

  section('Scoreboard persistence');
  var sb = arcade.Scoreboard('test-' + Date.now());
  sb.clear();
  assert('fresh scoreboard has no field', sb.get('high') === undefined);
  sb.set('high', 42);
  assert('set then get returns 42', sb.get('high') === 42);
  var updated = sb.update('high', 100, function (a, b) { return a > b; });
  assert('update to higher value succeeds', updated === true);
  assert('updated high is 100', sb.get('high') === 100);
  var rejected = sb.update('high', 50, function (a, b) { return a > b; });
  assert('update to lower value rejected', rejected === false);
  assert('rejected high still 100', sb.get('high') === 100);
  sb.clear();
  assert('after clear, field is gone', sb.get('high') === undefined);

  section('Streak counter');
  var streak = arcade.Streak();
  assert('fresh streak is 0', streak.get() === 0);
  streak.increment();
  streak.increment();
  streak.increment();
  assert('after 3 increments, streak is 3', streak.get() === 3);
  assert('best is 3', streak.best() === 3);
  streak.reset();
  assert('after reset, streak is 0', streak.get() === 0);
  assert('best is still 3', streak.best() === 3);

  section('E8 lib parity');
  assert('E8.roots.all() has 240 roots', E8.roots.all().length === 240);
  assert('E8.roots.integer() has 112', E8.roots.integer().length === 112);
  assert('E8.roots.halfInteger() has 128', E8.roots.halfInteger().length === 128);
  assert('E8.simpleRoots has 8 entries', E8.simpleRoots.length === 8);
  assert('E8.weylOrder = 696,729,600', E8.weylOrder === 696729600);
  assert('E8.coxeterNumber = 30', E8.coxeterNumber === 30);

  // Dot products check: all pairs in {-2, -1, 0, 1, 2}
  var allOk = true;
  var rs = E8.roots.all();
  outer: for (var i = 0; i < rs.length; i++) {
    for (var j = 0; j < rs.length; j++) {
      var d = Math.round(E8.dot(rs[i], rs[j]));
      if (d < -2 || d > 2 || Math.abs(d - E8.dot(rs[i], rs[j])) > 1e-9) {
        allOk = false;
        break outer;
      }
    }
  }
  assert('All 57,600 pairwise inner products lie in {-2,-1,0,1,2}', allOk);

  // Coxeter plane basis orthonormal
  var uu = E8.dot(E8.coxeterPlane.u, E8.coxeterPlane.u);
  var vv = E8.dot(E8.coxeterPlane.v, E8.coxeterPlane.v);
  var uv = E8.dot(E8.coxeterPlane.u, E8.coxeterPlane.v);
  assert('Coxeter plane |u|^2 = 1', Math.abs(uu - 1) < 1e-9);
  assert('Coxeter plane |v|^2 = 1', Math.abs(vv - 1) < 1e-9);
  assert('Coxeter plane u dot v = 0', Math.abs(uv) < 1e-9);

  // Coxeter plane projection gives 8 rings of 30
  var radii = {};
  rs.forEach(function (r) {
    var p = E8.project.toCoxeterPlane(r);
    var rr = Math.round(Math.sqrt(p[0] * p[0] + p[1] * p[1]) * 1000);
    radii[rr] = (radii[rr] || 0) + 1;
  });
  assert('Coxeter plane projection has 8 distinct radii', Object.keys(radii).length === 8);
  var allThirties = Object.keys(radii).every(function (k) { return radii[k] === 30; });
  assert('Every Coxeter plane ring has 30 points', allThirties);

  // Lattice shell counts
  assert('Shell squared-length 2 has 240 vectors', E8.lattice.shell(2).length === 240);
  assert('Shell squared-length 4 has 2160 vectors', E8.lattice.shell(4).length === 2160);

  // Packing density
  var expectedDensity = Math.PI * Math.PI * Math.PI * Math.PI / 384;
  assert('Packing density = π⁴ / 384',
    Math.abs(E8.lattice.packingDensity - expectedDensity) < 1e-10);

  section('OCT.fano basis products');
  assert('OCT.fano has 7 lines', OCT.fano.lines.length === 7);
  // All forward cyclic lines
  var forwardOk = true;
  OCT.fano.lines.forEach(function (l) {
    var p1 = OCT.fano.product(l[0], l[1]);
    var p2 = OCT.fano.product(l[1], l[2]);
    var p3 = OCT.fano.product(l[2], l[0]);
    if (!p1 || p1.idx !== l[2] || p1.sign !== 1) forwardOk = false;
    if (!p2 || p2.idx !== l[0] || p2.sign !== 1) forwardOk = false;
    if (!p3 || p3.idx !== l[1] || p3.sign !== 1) forwardOk = false;
  });
  assert('Every Fano line closes cyclically (forward = +)', forwardOk);
  // Anti-commutativity on every basis pair
  var antiOk = true;
  for (var bi = 1; bi < 8 && antiOk; bi++) {
    for (var bj = 1; bj < 8; bj++) {
      if (bi === bj) continue;
      var pab = OCT.fano.product(bi, bj);
      var pba = OCT.fano.product(bj, bi);
      if (!pab || !pba || pab.idx !== pba.idx || pab.sign !== -pba.sign) {
        antiOk = false; break;
      }
    }
  }
  assert('basis products anti-commute: e_i e_j = -e_j e_i', antiOk);
  // Real axis: e_0 * e_i = e_i, e_i * e_0 = e_i
  var realOk = true;
  for (var ri = 0; ri < 8; ri++) {
    var l1 = OCT.fano.product(0, ri);
    var l2 = OCT.fano.product(ri, 0);
    if (!l1 || l1.idx !== ri || l1.sign !== 1) realOk = false;
    if (!l2 || l2.idx !== ri || l2.sign !== 1) realOk = false;
  }
  assert('e_0 acts as identity on basis products', realOk);
  // Self-square
  var sqOk = true;
  for (var si = 1; si < 8; si++) {
    var ss = OCT.fano.product(si, si);
    if (!ss || ss.idx !== 0 || ss.sign !== -1) sqOk = false;
  }
  assert('e_i² = -1 for i ≥ 1', sqOk);

  section('Cayley-Dickson agrees with the Fano table');
  var cdOk = true;
  for (var ci = 0; ci < 8 && cdOk; ci++) {
    for (var cj = 0; cj < 8; cj++) {
      var Ei = OCT.oct.basisVec(ci);
      var Ej = OCT.oct.basisVec(cj);
      var r = OCT.cd(Ei, Ej);
      var expect = OCT.fano.product(ci, cj);
      var expected = [0,0,0,0,0,0,0,0];
      expected[expect.idx] = expect.sign;
      for (var kk = 0; kk < 8; kk++) {
        if (r[kk] !== expected[kk]) { cdOk = false; break; }
      }
      if (!cdOk) break;
    }
  }
  assert('OCT.cd(e_i, e_j) matches OCT.fano.product for all 64 pairs', cdOk);

  // Non-associativity should still surface
  var eA = OCT.oct.basisVec(1);
  var eB = OCT.oct.basisVec(2);
  var eC = OCT.oct.basisVec(4);
  var left  = OCT.oct.mul(OCT.oct.mul(eA, eB), eC);
  var right = OCT.oct.mul(eA, OCT.oct.mul(eB, eC));
  var differs = false;
  for (var ni = 0; ni < 8; ni++) if (left[ni] !== right[ni]) { differs = true; break; }
  assert('(e1·e2)·e4 ≠ e1·(e2·e4) — octonions are non-associative', differs);

  section('OCT.cdSteps matches OCT.cd');
  var stepsOk = true;
  for (var di = 0; di < 8 && stepsOk; di++) {
    for (var dj = 0; dj < 8; dj++) {
      var Xd = OCT.oct.basisVec(di);
      var Yd = OCT.oct.basisVec(dj);
      var s = OCT.cdSteps(Xd, Yd);
      var m = OCT.cd(Xd, Yd);
      for (var dk = 0; dk < 8; dk++) {
        if (Math.abs(s.result[dk] - m[dk]) > 1e-9) { stepsOk = false; break; }
      }
      if (!stepsOk) break;
    }
  }
  assert('cdSteps(X,Y).result == cd(X,Y) on every basis pair', stepsOk);

  section('Octavian units (240 E8 roots)');
  assert('OCT.octavian.units has 240 entries', OCT.octavian.units.length === 240);
  var normOk = OCT.octavian.units.every(function (v) {
    var s = 0;
    for (var i = 0; i < 8; i++) s += v[i] * v[i];
    return Math.abs(s - 2) < 1e-9;
  });
  assert('every unit has |v|² = 2', normOk);
  var isUnitOk = OCT.octavian.units.every(function (v) { return OCT.octavian.isUnit(v); });
  assert('isUnit accepts all 240 generated units', isUnitOk);
  // Split: 112 integer, 128 half-integer
  var intCount = 0;
  var halfCount = 0;
  OCT.octavian.units.forEach(function (v) {
    var cls = OCT.octavian.classify(v);
    if (cls.family === 'integer') intCount++;
    if (cls.family === 'half') halfCount++;
  });
  assert('112 integer-family units', intCount === 112);
  assert('128 half-integer-family units', halfCount === 128);

  // Classifier rejects traps
  var traps = [
    { v: [1, 0, 0, 0, 0, 0, 0, 0], tag: 'wrong-support' },
    { v: [1, 1, 1, 0, 0, 0, 0, 0], tag: 'wrong-support' },
    { v: [2, 1, 0, 0, 0, 0, 0, 0], tag: 'wrong-magnitude' },
    { v: [-0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5], tag: 'wrong-parity' },
    { v: [1, 0.5, 0, 0, 0, 0, 0, 0], tag: 'mixed' }
  ];
  var trapOk = true;
  traps.forEach(function (t) {
    var cls = OCT.octavian.classify(t.v);
    if (cls.valid) trapOk = false;
    if (cls.family !== t.tag) trapOk = false;
  });
  assert('classifier tags each trap family correctly', trapOk);

  section('Summary');
  summary.className = 'summary ' + (failed === 0 ? 'all-pass' : 'any-fail');
  summary.textContent = passed + ' passed, ' + failed + ' failed';
})();
</script>

</body>
</html>
