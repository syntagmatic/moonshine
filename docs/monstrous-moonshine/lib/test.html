<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>moonshine-math.js sanity tests</title>
<script src="moonshine-math.js"></script>
<style>
body { font-family: 'Source Code Pro', monospace; padding: 2rem; background: #0f1020; color: #e0e0f0; }
.pass { color: #64ff9a; }
.fail { color: #ff6b6b; }
.row { padding: 0.25rem 0; border-bottom: 1px dashed #303060; }
h1 { font-family: sans-serif; color: #64ff9a; }
h2 { font-family: sans-serif; color: #9a9aff; margin-top: 1.5rem; }
.detail { color: #8080a0; font-size: 0.9em; }
</style>
</head>
<body>
<h1>Moon — sanity checks</h1>
<div id="out"></div>

<script>
var out = document.getElementById('out');
var total = 0, passed = 0;

function check(label, cond, detail) {
  total++;
  if (cond) passed++;
  var row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<span class="' + (cond ? 'pass' : 'fail') + '">' +
    (cond ? 'PASS' : 'FAIL') + '</span> ' + label +
    (detail ? ' <span class="detail">' + detail + '</span>' : '');
  out.appendChild(row);
}

function section(title) {
  var h = document.createElement('h2');
  h.textContent = title;
  out.appendChild(h);
}

// ─── Monster order ────────────────────────────────────────────────
section('Monster group order');
var order = Moon.monster.order();
var expected = 808017424794512875886459904961710757005754368000000000n;
check('|𝕄| = product of prime powers equals the canonical value',
  order === expected, order.toString());
check('|𝕄| has 54 decimal digits',
  order.toString().length === 54);

// ─── Monster irrep table is monotone ──────────────────────────────
section('Monster irreps');
var irreps = Moon.monster.irreps;
check('first irrep has dimension 1',
  irreps[0].dim === 1n);
check('second irrep has dimension 196 883',
  irreps[1].dim === 196883n);
check('third irrep has dimension 21 296 876',
  irreps[2].dim === 21296876n);
check('fourth irrep has dimension 842 609 326',
  irreps[3].dim === 842609326n);
check('fifth irrep has dimension 18 538 750 076',
  irreps[4].dim === 18538750076n);
check('dimensions are strictly increasing',
  irreps.every(function (r, i) { return i === 0 || r.dim > irreps[i-1].dim; }));

// ─── McKay–Thompson decompositions ────────────────────────────────
section('McKay–Thompson head decompositions');
Moon.mckay.heads.forEach(function (entry) {
  var result = Moon.mckay.verify(entry);
  check('c(' + entry.n + ') = ' + entry.label,
    result.ok,
    'expected ' + Moon.fmt.group(result.expected) + ', got ' + Moon.fmt.group(result.actual));
});

// ─── j-coefficients match the McKay–Thompson totals ───────────────
section('j-coefficient consistency');
Moon.mckay.heads.forEach(function (entry) {
  var jc = Moon.j.coefficient(entry.n);
  check('Moon.j.coefficient(' + entry.n + ') equals the MT entry total',
    jc === entry.total,
    Moon.fmt.group(jc));
});

// ─── SL₂(ℤ) fundamental-domain reduction ──────────────────────────
section('Modular reduction');
var test1 = Moon.modular.reduce({ re: 0.7, im: 0.3 });
check('reduction lands in the fundamental domain',
  Math.abs(test1.point.re) <= 0.5 + 1e-9 && test1.point.re * test1.point.re + test1.point.im * test1.point.im >= 1 - 1e-9,
  'τ → (' + test1.point.re.toFixed(4) + ', ' + test1.point.im.toFixed(4) + ')');

var test2 = Moon.modular.reduce({ re: 3.2, im: 0.8 });
check('reduction handles large Re τ',
  Math.abs(test2.point.re) <= 0.5 + 1e-9,
  'τ → (' + test2.point.re.toFixed(4) + ', ' + test2.point.im.toFixed(4) + ')');

var test3 = Moon.modular.reduce({ re: 0.01, im: 0.05 });
check('reduction handles τ near the real axis',
  test3.point.im > 0.5,
  'τ → (' + test3.point.re.toFixed(4) + ', ' + test3.point.im.toFixed(4) + ')');

// ─── Fundamental domain outline ───────────────────────────────────
section('Fundamental domain outline');
var outline = Moon.modular.fundamentalOutline(3, 40);
check('outline has nodes',
  outline.length > 40);
check('outline left wall at Re = -1/2',
  Math.abs(outline[0].re + 0.5) < 1e-9);
check('outline right wall at Re = 1/2',
  Math.abs(outline[outline.length - 1].re - 0.5) < 1e-9);

// ─── SL₂(ℤ) matrix enumeration ────────────────────────────────────
section('SL₂(ℤ) matrix enumeration');
var mats = Moon.modular.sl2Matrices(3);
check('all enumerated matrices have determinant 1',
  mats.every(function (m) { return m[0] * m[3] - m[1] * m[2] === 1; }));
check('identity matrix is present',
  mats.some(function (m) { return m[0] === 1 && m[1] === 0 && m[2] === 0 && m[3] === 1; }));
check('S = [[0,-1],[1,0]] is present',
  mats.some(function (m) { return m[0] === 0 && m[1] === -1 && m[2] === 1 && m[3] === 0; }));

// ─── Number formatting ────────────────────────────────────────────
section('Number formatting');
check('group(196884) uses thin-space separators',
  Moon.fmt.group(196884) === '196\u2009884');
check('group(BigInt) works',
  Moon.fmt.group(196884n) === '196\u2009884');
check('order(Monster order) returns compact scientific',
  Moon.fmt.order(order).indexOf('10') > 0);

// ─── Summary ──────────────────────────────────────────────────────
var summary = document.createElement('h2');
summary.textContent = passed + ' / ' + total + ' passed';
summary.style.color = passed === total ? '#64ff9a' : '#ff6b6b';
out.appendChild(summary);
</script>
</body>
</html>
